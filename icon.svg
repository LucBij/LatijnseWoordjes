<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#831843" />
      <stop offset="50%" stop-color="#701a75" />
      <stop offset="100%" stop-color="#4c0519" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#eab308" />
      <stop offset="100%" stop-color="#ca8a04" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Background rounded rect -->
  <rect width="512" height="512" rx="104" fill="url(#bgGrad)" />

  <!-- Inner ornate border -->
  <rect x="28" y="28" width="456" height="456" rx="84" fill="none" stroke="url(#goldGrad)" stroke-width="4" stroke-opacity="0.45" />

  <!-- Laurel Wreath & Column Icon -->
  <g filter="url(#shadow)" transform="translate(0, -10)">
    <!-- Classical Column Capital / Pedestal -->
    <path d="M 196 350 L 316 350 L 330 380 L 182 380 Z" fill="url(#goldGrad)" />
    <path d="M 216 230 L 296 230 L 306 350 L 206 350 Z" fill="url(#goldGrad)" opacity="0.9" />
    <path d="M 180 200 L 332 200 L 342 230 L 170 230 Z" fill="url(#goldGrad)" />
    
    <!-- Open Book / Codex -->
    <path d="M 150 140 C 200 120 240 140 256 160 C 272 140 312 120 362 140 L 362 250 C 312 230 272 250 256 270 C 240 250 200 230 150 250 Z" fill="#fffbeb" />
    <path d="M 256 160 L 256 270" stroke="#b45309" stroke-width="3" stroke-linecap="round" />
    
    <!-- Text Lines on book -->
    <line x1="175" y1="170" x2="235" y2="160" stroke="#ca8a04" stroke-width="3" stroke-linecap="round" />
    <line x1="175" y1="195" x2="235" y2="185" stroke="#ca8a04" stroke-width="3" stroke-linecap="round" />
    <line x1="175" y1="220" x2="225" y2="210" stroke="#ca8a04" stroke-width="3" stroke-linecap="round" />
    <line x1="277" y1="160" x2="337" y2="170" stroke="#ca8a04" stroke-width="3" stroke-linecap="round" />
    <line x1="277" y1="185" x2="337" y2="195" stroke="#ca8a04" stroke-width="3" stroke-linecap="round" />
    <line x1="287" y1="210" x2="337" y2="220" stroke="#ca8a04" stroke-width="3" stroke-linecap="round" />

    <!-- Stylized Laurel Leaves Left -->
    <path d="M 140 220 C 110 200 110 160 140 140 C 130 170 140 200 140 220 Z" fill="url(#goldGrad)" />
    <path d="M 125 280 C 95 260 95 220 125 200 C 115 230 125 260 125 280 Z" fill="url(#goldGrad)" />
    <path d="M 135 340 C 110 320 110 280 140 260 C 130 290 140 320 135 340 Z" fill="url(#goldGrad)" />

    <!-- Stylized Laurel Leaves Right -->
    <path d="M 372 220 C 402 200 402 160 372 140 C 382 170 372 200 372 220 Z" fill="url(#goldGrad)" />
    <path d="M 387 280 C 417 260 417 220 387 200 C 397 230 387 260 387 280 Z" fill="url(#goldGrad)" />
    <path d="M 377 340 C 402 320 402 280 372 260 C 382 290 372 320 377 340 Z" fill="url(#goldGrad)" />
  </g>

  <!-- Banner text: LINGUA LATINA -->
  <rect x="116" y="408" width="280" height="46" rx="23" fill="url(#goldGrad)" />
  <text x="256" y="438" font-family="Cinzel, Georgia, serif" font-size="20" font-weight="900" fill="#4c0519" text-anchor="middle" letter-spacing="4">VOX LATINA</text>
</svg>
